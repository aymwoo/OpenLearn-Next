<button class="text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full transition-all duration-200 scale-95 active:scale-90">

<h1 class="font-display-xl text-display-xl text-on-background">

<span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary">赋能未来</span>
</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-lg mx-auto">

<p class="font-body-md text-body-md text-on-surface-variant">请登录您的账户继续学习</p>

</div>
