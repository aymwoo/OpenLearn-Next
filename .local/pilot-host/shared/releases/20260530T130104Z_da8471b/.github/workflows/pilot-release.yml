name: pilot-release-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pilot-release:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DB_FILE_NAME: file:ci.db
      AUTH_SECRET: ci-auth-secret-0123456789
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ci-server-actions-key-0123456789abcdef
      ASYNC_TASKS_ENABLED: true
      BULLMQ_REDIS_URL: redis://127.0.0.1:6379
      REDIS_FANOUT_ENABLED: false
      OPENLEARN_DEPLOY_ENV: ci
      OPENLEARN_SHARED_ROOT: ${{ runner.temp }}/openlearn-shared
      OPENLEARN_CURRENT_ROOT: ${{ github.workspace }}
      OPENLEARN_RUNTIME_ASSETS_ROOT: ${{ runner.temp }}/openlearn-assets
      OPENLEARN_RELEASE_MANIFESTS_DIR: ${{ github.workspace }}/ops/releases/manifests
      OPENLEARN_HEALTHCHECK_BASE_URL: http://127.0.0.1:3100
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare CI directories
        run: |
          mkdir -p "$OPENLEARN_SHARED_ROOT" "$OPENLEARN_RUNTIME_ASSETS_ROOT" "$OPENLEARN_RELEASE_MANIFESTS_DIR"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test --run

      - name: Build
        run: pnpm build

      - name: Migrate database
        run: pnpm db:migrate

      - name: Verify phase 57 baseline
        run: pnpm verify:phase57

      - name: Verify phase 58 baseline
        run: pnpm verify:phase58

      - name: Verify phase 59 baseline
        run: pnpm verify:phase59

      - name: Start web and worker
        run: |
          PORT=3100 pnpm start > "$RUNNER_TEMP/openlearn-web.log" 2>&1 &
          WEB_PID=$!
          pnpm worker:start > "$RUNNER_TEMP/openlearn-worker.log" 2>&1 &
          WORKER_PID=$!
          echo "WEB_PID=$WEB_PID" >> "$GITHUB_ENV"
          echo "WORKER_PID=$WORKER_PID" >> "$GITHUB_ENV"

      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Health endpoint never became ready"
          exit 1

      - name: Check ready endpoint
        run: curl -fsS http://127.0.0.1:3100/api/ready

      - name: Cleanup background processes
        if: always()
        run: |
          if [ -n "${WEB_PID:-}" ]; then kill "$WEB_PID" 2>/dev/null || true; fi
          if [ -n "${WORKER_PID:-}" ]; then kill "$WORKER_PID" 2>/dev/null || true; fi
